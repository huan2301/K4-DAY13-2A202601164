alerts:
  - name: HighTailLatency
    severity: warning
    sli: latency_p95_ms
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    user_impact: Người dùng phải chờ lâu hơn 3 giây để nhận câu trả lời
    owner: YOUR_NAME
    runbook: docs/alerts.md#alert-1

  - name: HighRequestErrorRate
    severity: critical
    sli: error_rate_pct
    condition: request_failed / request_received * 100 > 2
    duration: 5m
    type: symptom-based
    user_impact: Hơn 2% request không trả về câu trả lời thành công
    owner: YOUR_NAME
    runbook: docs/alerts.md#alert-2

  - name: LowResponseQuality
    severity: warning
    sli: quality_score_avg
    condition: mean(response_sent.quality_score) < 0.75
    duration: 10m
    type: symptom-based
    user_impact: Câu trả lời có thể thiếu ngữ cảnh hoặc không đáp ứng câu hỏi
    owner: YOUR_NAME
    runbook: docs/alerts.md#alert-3